name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-msvc:
    name: Windows MSVC (${{ matrix.job }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: release
            preset: windows-msvc
            build_preset: windows-release
            test_preset: windows-release
          - job: debug
            preset: windows-msvc
            build_preset: windows-debug
            test_preset: ""
          - job: sanitized
            preset: windows-msvc-asan
            build_preset: windows-asan
            test_preset: windows-asan
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}
      - name: Test
        if: matrix.test_preset != ''
        run: ctest --preset ${{ matrix.test_preset }}

  linux-clang:
    name: Linux Clang (${{ matrix.job }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: release
            preset: linux-clang
            build_preset: linux-release
            test_preset: linux-release
          - job: debug
            preset: linux-clang-debug
            build_preset: linux-debug
            test_preset: ""
          - job: sanitized
            preset: linux-clang-sanitized
            build_preset: linux-sanitized
            test_preset: linux-sanitized
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang xorg-dev xvfb
      # lavapipe (Mesa's software Vulkan driver) lets the renderer smoke test
      # actually draw on a GPU-less runner. Skipped for the sanitized job:
      # driver internals under ASan/LSan produce reports we do not own, so
      # that job exercises the graceful no-Vulkan path instead.
      - name: Install software Vulkan driver
        if: matrix.job != 'sanitized'
        run: sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}
      - name: Test
        if: matrix.test_preset != ''
        run: ctest --preset ${{ matrix.test_preset }}

  # First fuzz harness (Week 5): throw arbitrary bytes at load_gltf under
  # ASan/UBSan for a short timed run. Seeds live in tools/fuzz/corpus/gltf.
  linux-fuzz-gltf:
    name: Linux Clang (fuzz glTF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # xorg-dev: hue_core pulls GLFW even though the fuzzer never opens a window.
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang xorg-dev
      - name: Configure
        run: >
          cmake --preset linux-clang-sanitized
          -DHUE_FUZZ=ON
          -DHUE_TRACY_ENABLE=OFF
      - name: Build fuzz_gltf
        run: cmake --build --preset linux-sanitized --target fuzz_gltf
      - name: Fuzz glTF import (60s)
        run: >
          mkdir -p artifacts &&
          ./build/linux-clang-sanitized/tools/fuzz/fuzz_gltf
          tools/fuzz/corpus/gltf
          -max_total_time=60
          -timeout=10
          -rss_limit_mb=2048
          -artifact_prefix=artifacts/
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-gltf-artifacts
          path: artifacts/
          if-no-files-found: ignore
